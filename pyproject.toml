[project]
name = "nexus-flux-studio"
version = "1.0.0"
description = "Local full-stack Flux image generation studio optimized for RTX 5090"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"
